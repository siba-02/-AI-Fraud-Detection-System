<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fraud Detection System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">🛡️ AI Fraud Detection</div>
        <div class="nav-buttons">
            <button class="btn btn-outline" onclick="location.href='login.html'">Login</button>
            <button class="btn btn-primary" onclick="location.href='register.html'">Register</button>
        </div>
    </div>

    <div class="container fade-in">
        <div style="text-align: center; padding: 4rem 0;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                AI-Powered Fraud Detection
            </h1>
            <p style="font-size: 1.25rem; color: white; margin-bottom: 2rem;">
                Protect your transactions with real-time AI monitoring
            </p>
            <button class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;" onclick="location.href='register.html'">
                Get Started →
            </button>
        </div>

        <div class="stats-grid" style="margin-top: 2rem;">
            <div class="stat-card">
                <div class="stat-title">Real-time Monitoring</div>
                <div class="stat-value">24/7</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Fraud Detection Rate</div>
                <div class="stat-value">99.9%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Protected Users</div>
                <div class="stat-value">10K+</div>
            </div>
        </div>
    </div>
</body>
</html>
